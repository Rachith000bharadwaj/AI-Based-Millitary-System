services:
  # --- Backend Flask API Service ---
  - type: web
    name: aegisai-backend
    env: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT "api.app:create_app()"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: aegis_ai_db
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: mixtral-8x7b-32768
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # --- Frontend Next.js Web Service ---
  - type: web
    name: aegisai-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aegisai-backend
          property: url
